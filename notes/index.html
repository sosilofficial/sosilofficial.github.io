@media (min-width: 821px) {
  /*
   * Notes should read like a compact archive rather than isolated cards.
   * Use an 8px-based rhythm so the two rows feel deliberately related.
   */
  .note-index {
    display: grid;
    gap: 24px;
    max-width: 32rem;
  }
  .note-index a {
    display: grid;
    grid-template-columns: 7.2rem minmax(0, 1fr);

    gap: 0 12px;
    padding: 0;
    line-height: 1.6;
  }
  .note-index a.is-selected {
    background: rgba(72, 80, 91, .022);
  }

  /*
   * Mirror the real Notes heading in the detail column instead of estimating
   * its height with a calc(). The invisible heading occupies the exact same
   * vertical space as the left heading, so the detail date and first index row
   * share one horizontal baseline even if typography changes later.
   */

    padding-top: var(--category-top-y, clamp(48px, 6.8vh, 70px)) !important;
  }

</style><style id="global-grid-lines-style">
@media (min-width: 821px) {
  /*
   * One shared coordinate system for every desktop split page.
   * Keeping a stable scrollbar gutter prevents long/short pages from shifting
   * the content width by a few pixels relative to Discography.
   */
  html {
    scrollbar-gutter: stable;
  }

  .site-main {
    margin-left: max(var(--sidebar), 118px) !important;
    width: calc(100% - max(var(--sidebar), 118px)) !important;
    max-width: none !important;
  }

  /*
   * The sidebar edge should feel like the other dividers: a quiet trace rather
   * than a hard UI rule. Let it fade before reaching the viewport edges and
   * keep it a little softer than the content divider.
   */
  .side-rail {
    border-right: 0 !important;
  }

  .side-rail::after {
    content: "" !important;
    position: absolute !important;
    z-index: 1 !important;
    top: 9vh !important;
    bottom: 9vh !important;
    right: 0 !important;
    width: 1px !important;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      var(--line) 14%,
      var(--line) 86%,
      transparent 100%
    ) !important;
    opacity: .24 !important;
    pointer-events: none !important;
  }

  /* Discography remains the master split for all regular list/detail pages. */
  .split-layout:not(.info-split) {
    display: grid !important;
    position: relative !important;
    width: 100% !important;
    min-width: 0 !important;
    max-width: none !important;
    grid-template-columns: minmax(0, 38.8888889%) minmax(0, 61.1111111%) !important;
  }

  .split-layout:not(.info-split) > .index-panel {
    grid-column: 1 !important;
    width: auto !important;
    min-width: 0 !important;
    max-width: none !important;
  }

  .split-layout:not(.info-split) > .detail-panel {
    grid-column: 2 !important;
    width: auto !important;
    min-width: 0 !important;
    max-width: none !important;
    left: auto !important;
    right: auto !important;
    box-sizing: border-box !important;
    border-left: 0 !important;
  }

  /*
   * Keep the structural divider, but let it read more like a faint trace than UI chrome:
   * it stops short of the viewport edges and softly fades in/out.
   */
  .split-layout:not(.info-split)::after {
    content: "" !important;
    position: absolute !important;
    z-index: 40 !important;
    top: 9vh !important;
    bottom: 9vh !important;
    left: 38.8888889% !important;
    width: 1px !important;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      var(--line) 12%,
      var(--line) 88%,
      transparent 100%
    ) !important;
    opacity: .30 !important;
    pointer-events: none !important;
  }

  /* Info: media/links on the narrower left, biography on the wider right. */
  .info-split {
    display: grid !important;
    position: relative !important;
    width: 100% !important;
    min-width: 0 !important;
    max-width: none !important;
    grid-template-columns: minmax(0, 42.7%) minmax(0, 57.3%) !important;
  }

  .info-split > .index-panel,
  .info-split > .detail-panel {
    width: auto !important;
    min-width: 0 !important;
    max-width: none !important;
    box-sizing: border-box !important;
    border-left: 0 !important;
    padding: clamp(42px, 5.5vh, 58px) !important;
  }

  .info-split > .index-panel {
    grid-column: 1 !important;
  }

  .info-split > .detail-panel {
    grid-column: 2 !important;
    left: auto !important;
    right: auto !important;
  }

  .info-split .info-aside,
  .info-split .info-copy {
    margin-top: 0 !important;
    justify-self: start !important;
  }

  .info-split .info-aside {
    width: min(100%, 420px) !important;
  }

  .info-split .info-copy {
    width: min(100%, 44ch) !important;
    max-width: 44ch !important;
  }

  /* Info is read as one editorial spread, so whitespace does the separation here. */
  .info-split::after {
    content: none !important;
    display: none !important;
  }
}
