name: Restore info profile image

on:
  push:
    branches: [main]
    paths:
      - ".tmp/profile/go.txt"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Rebuild sharp profile image
        run: |
          cat .tmp/profile/part1.b64 .tmp/profile/part2.b64 .tmp/profile/part3.b64 .tmp/profile/part4.b64 .tmp/profile/part5.b64 | base64 --decode > media/profile/sosil-info-profile-v2.jpg
          test "$(wc -c < media/profile/sosil-info-profile-v2.jpg)" -gt 30000
          file media/profile/sosil-info-profile-v2.jpg | grep -q "JPEG image data"

      - name: Switch info page to the new image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('info/index.html')
          s = p.read_text()
          old = '/media/profile/sosil-info-profile.jpg'
          new = '/media/profile/sosil-info-profile-v2.jpg'
          if old not in s:
              raise SystemExit('old profile path not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Remove temporary staging files
        run: |
          rm -rf .tmp/profile
          rm -f .github/workflows/restore-info-profile.yml

      - name: Commit restored image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore sharp info profile image"
          git push origin main
