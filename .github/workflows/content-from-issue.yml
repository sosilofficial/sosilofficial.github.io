name: Publish content from issue

on:
  issues:
    types: [opened, reopened]

concurrency:
  group: sosil-content-publish
  cancel-in-progress: false

jobs:
  publish:
    if: (startsWith(github.event.issue.title, '[Content]') || startsWith(github.event.issue.title, '[Edit]')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create content file
        if: startsWith(github.event.issue.title, '[Content]')
        run: node scripts/publish-issue.mjs
      - name: Edit content file
        if: startsWith(github.event.issue.title, '[Edit]')
        run: node scripts/edit-content.mjs

      # Keep publishing deterministic. The approved 2026-09-27 site is the
      # direct build-content layout; legacy apply-* layout postprocessors are
      # intentionally not run here because they rewrite that approved design.
      - name: Build static pages
        run: node scripts/build-content.mjs
      - name: Apply homepage layout
        run: node scripts/apply-home-layout.mjs
      - name: Apply News thumbnail hero
        run: node scripts/apply-news-layout.mjs
      - name: Apply persistent SEO metadata
        run: node scripts/apply-seo.mjs
      - name: Guard approved layout structure
        run: |
          grep -Fq 'wide-page works-section-page' works/discography/index.html
          grep -Fq 'wide-page works-section-page' works/videos/index.html
          grep -Fq 'photo-masonry' archive/photo-video/index.html
          grep -Fq 'text-index archive-text-index' archive/links/index.html
          grep -Fq '<div class="panel-title">notes</div>' notes/index.html
          grep -Fq '<div class="panel-title">merch</div>' merch/index.html
          ! grep -Fq 'archive-desktop-only' archive/index.html
          ! grep -Fq 'notes-aligned-detail' notes/1/index.html
      - name: Validate generated site
        run: node scripts/validate-site.mjs
      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content . ':!.github'
          git commit -m "Apply content issue #${{ github.event.issue.number }}"
          git push origin main
      - name: Close successful issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "사이트에 반영했습니다. GitHub Pages 배포가 이어서 진행됩니다."
