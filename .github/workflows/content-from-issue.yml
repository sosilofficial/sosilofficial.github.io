name: Publish content from issue

on:
  issues:
    types: [opened, reopened]

concurrency:
  group: sosil-content-publish
  cancel-in-progress: false

jobs:
  publish:
    if: (startsWith(github.event.issue.title, '[Content]') || startsWith(github.event.issue.title, '[Edit]')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create content file
        if: startsWith(github.event.issue.title, '[Content]')
        run: node scripts/publish-issue.mjs
      - name: Edit content file
        if: startsWith(github.event.issue.title, '[Edit]')
        run: node scripts/edit-content.mjs

      - name: Rebuild and validate September 27 layout
        run: node scripts/rebuild-site.mjs
      - name: Install browser QA dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser QA
        run: node scripts/browser-qa.mjs
      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content . ':!.github'
          git commit -m "Apply content issue #${{ github.event.issue.number }}"
          git push origin main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage static site
        run: node scripts/stage-pages.mjs
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sosil-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Close successful issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "사이트에 반영했습니다. GitHub Pages 배포까지 완료했습니다."
