name: Rebuild site from content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/build-content.mjs"
      - "scripts/build-site.mjs"
      - "scripts/validate-site.mjs"
      - "scripts/browser-qa.mjs"
      - "scripts/consolidate-layout-styles.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/apply-home-layout.mjs"
      - "scripts/apply-video-layout.mjs"
      - "scripts/apply-discography-layout.mjs"
      - "scripts/apply-live-layout.mjs"
      - "scripts/apply-merch-layout.mjs"
      - "scripts/apply-archive-photo-layout.mjs"
      - "scripts/apply-archive-text-layout.mjs"
      - "scripts/apply-notes-layout.mjs"
      - "scripts/apply-shared-ui.mjs"
      - "scripts/apply-mobile-detail-pages.mjs"
      - "scripts/fix-archive-video-legacy.mjs"
      - "assets/site-redesign.css"
      - "assets/site-redesign.js"

concurrency:
  group: sosil-content-publish
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser QA dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and validate site
        run: npm run build
      - name: Run browser QA
        run: node scripts/browser-qa.mjs
      - name: Commit generated files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild site from content"
          git push origin main
