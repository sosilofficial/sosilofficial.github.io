name: Rebuild site from content

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-from-content.yml"
      - "content/**"
      - "scripts/build-content.mjs"
      - "scripts/analytics.mjs"
      - "scripts/validate-site.mjs"
      - "scripts/apply-seo.mjs"
      - "scripts/apply-home-layout.mjs"
      - "scripts/apply-news-layout.mjs"
      - "assets/site-redesign.css"
      - "assets/site-redesign.js"
      - "assets/home-layout.css"

concurrency:
  group: sosil-content-publish
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The approved 2026-09-27 design is the direct build-content output.
      # Legacy apply-video/discography/live/merch/archive/notes/shared/mobile/
      # unified-grid postprocessors are intentionally excluded because rerunning
      # them rewrites the approved pages into an older experimental layout.
      - name: Build static pages
        run: node scripts/build-content.mjs
      - name: Apply homepage layout
        run: node scripts/apply-home-layout.mjs
      - name: Apply News thumbnail hero
        run: node scripts/apply-news-layout.mjs
      - name: Apply persistent SEO metadata
        run: node scripts/apply-seo.mjs
      - name: Guard approved layout structure
        run: |
          grep -Fq 'wide-page works-section-page' works/discography/index.html
          grep -Fq 'wide-page works-section-page' works/videos/index.html
          grep -Fq 'photo-masonry' archive/photo-video/index.html
          grep -Fq 'text-index archive-text-index' archive/links/index.html
          grep -Fq '<div class="panel-title">notes</div>' notes/index.html
          grep -Fq '<div class="panel-title">merch</div>' merch/index.html
          ! grep -Fq 'archive-desktop-only' archive/index.html
          ! grep -Fq 'notes-aligned-detail' notes/1/index.html
      - name: Validate generated site
        run: node scripts/validate-site.mjs
      - name: Commit generated files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild site from content"
          git push origin main
