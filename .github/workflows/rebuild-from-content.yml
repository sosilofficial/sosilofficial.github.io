name: Rebuild site from content

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-from-content.yml"
      - "content/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: sosil-content-publish
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Bandsintown integration
        run: node --test scripts/bandsintown.test.mjs
      - name: Sync upcoming shows
        env:
          BANDSINTOWN_API_KEY: ${{ secrets.BANDSINTOWN_API_KEY }}
        run: node scripts/sync-bandsintown.mjs
      - name: Rebuild and validate September 27 layout
        run: node scripts/rebuild-site.mjs
      - name: Install browser QA dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser QA
        run: node scripts/browser-qa.mjs
      - name: Commit generated files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild site from content"
          git push origin main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage static site
        run: node scripts/stage-pages.mjs
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/sosil-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
