name: Rebuild site from content

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-from-content.yml"
      - "content/**"
      - "scripts/build-content.mjs"
      - "scripts/validate-site.mjs"
      - "scripts/browser-qa.mjs"
      - "scripts/consolidate-layout-styles.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/apply-home-layout.mjs"
      - "scripts/apply-video-layout.mjs"
      - "scripts/apply-discography-layout.mjs"
      - "scripts/apply-live-layout.mjs"
      - "scripts/apply-merch-layout.mjs"
      - "scripts/apply-archive-photo-layout.mjs"
      - "scripts/apply-archive-text-layout.mjs"
      - "scripts/apply-notes-layout.mjs"
      - "scripts/apply-shared-ui.mjs"
      - "scripts/apply-mobile-detail-pages.mjs"
      - "scripts/apply-desktop-detail-scale.mjs"
      - "scripts/apply-unified-desktop-grid.mjs"
      - "scripts/fix-archive-video-legacy.mjs"
      - "assets/site-redesign.css"
      - "assets/site-redesign.js"

concurrency:
  group: sosil-content-publish
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser QA dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Consolidate shared layout styles
        run: node scripts/consolidate-layout-styles.mjs
      - name: Build static pages
        run: node scripts/build-content.mjs
      - name: Apply stable video layout
        run: node scripts/apply-video-layout.mjs
      - name: Apply Discography layout
        run: node scripts/apply-discography-layout.mjs
      - name: Apply Works Live layout
        run: node scripts/apply-live-layout.mjs
      - name: Apply stable merch layout
        run: node scripts/apply-merch-layout.mjs
      - name: Apply Archive Photo split layout
        run: node scripts/apply-archive-photo-layout.mjs
      - name: Apply Archive Text layout
        run: node scripts/apply-archive-text-layout.mjs
      - name: Apply slower Notes layout
        run: node scripts/apply-notes-layout.mjs
      - name: Apply homepage layout
        run: node scripts/apply-home-layout.mjs
      - name: Apply shared UI system
        run: node scripts/apply-shared-ui.mjs
      - name: Apply dedicated mobile detail screens
        run: node scripts/apply-mobile-detail-pages.mjs
      - name: Apply unified desktop grid
        run: node scripts/apply-unified-desktop-grid.mjs
      - name: Remove generated inline style copies
        run: node scripts/consolidate-layout-styles.mjs --strip-html
      - name: Normalize Archive video legacy routes
        run: node scripts/fix-archive-video-legacy.mjs
      - name: Validate generated site
        run: node scripts/validate-site.mjs
      - name: Align browser QA with unified desktop grid
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/browser-qa.mjs")
          source = path.read_text()

          source = source.replace(
              'const heading = await page.locator(".category-top h1").boundingBox();\n  const subnav = await page.locator(".category-top .subnav").boundingBox();\n  const gap = await page.locator(".category-top .subnav").evaluate((node) => getComputedStyle(node).columnGap || getComputedStyle(node).gap);',
              'const heading = await page.locator(".category-top h1:visible").first().boundingBox();\n  const subnav = await page.locator(".category-top .subnav:visible").first().boundingBox();\n  const gap = await page.locator(".category-top .subnav:visible").first().evaluate((node) => getComputedStyle(node).columnGap || getComputedStyle(node).gap);'
          )

          source = source.replace(
              'assertGridMatch(coverBox, videoBox, `${viewport.name}: Discography/Video 첫 이미지`, ["x", "y"]);',
              'assertGridMatch(coverBox, videoBox, `${viewport.name}: Discography/Video 첫 이미지`, viewport.width > 820 ? ["x", "y", "width"] : ["x", "y"]);'
          )

          old_archive = '''    const archivePhotoBox = await page.locator(".photo-post-grid").boundingBox();
    assert(worksRhythm.gap === archiveRhythm.gap, `${viewport.name}: Works와 Archive 하위 메뉴 간격이 다릅니다 (${worksRhythm.gap} / ${archiveRhythm.gap})`);
    assert(Math.abs(worksRhythm.verticalGap - archiveRhythm.verticalGap) <= 1, `${viewport.name}: Works와 Archive 제목-하위메뉴 간격이 다릅니다 (${worksRhythm.verticalGap}px / ${archiveRhythm.verticalGap}px)`);

    await open(page, "/archive/videos");
    const archiveVideoBox = await page.locator(".archive-video-grid, .wide-empty").boundingBox();
    assertGridMatch(archivePhotoBox, archiveVideoBox, `${viewport.name}: Archive Photo/Video 목록`, ["x", "y", "width"]);

    await open(page, "/archive/links");
    const archiveTextBox = await page.locator(".archive-text-groups").boundingBox();
    assertGridMatch(archivePhotoBox, archiveTextBox, `${viewport.name}: Archive Photo/Text 목록`, ["x", "y", "width"]);'''

          new_archive = '''    const archivePhotoBox = await visibleBox(page, viewport.width > 820 ? ".archive-desktop-only .photo-index" : ".archive-mobile-only .photo-masonry");
    assert(archivePhotoBox, `${viewport.name}: Archive Photo 목록을 찾지 못했습니다`);
    assert(worksRhythm.gap === archiveRhythm.gap, `${viewport.name}: Works와 Archive 하위 메뉴 간격이 다릅니다 (${worksRhythm.gap} / ${archiveRhythm.gap})`);
    assert(Math.abs(worksRhythm.verticalGap - archiveRhythm.verticalGap) <= 1, `${viewport.name}: Works와 Archive 제목-하위메뉴 간격이 다릅니다 (${worksRhythm.verticalGap}px / ${archiveRhythm.verticalGap}px)`);

    await open(page, "/archive/videos");
    const archiveVideoBox = await visibleBox(page, viewport.width > 820 ? ".archive-desktop-only .archive-video-index, .archive-desktop-only .empty-note" : ".archive-mobile-only .archive-video-grid, .archive-mobile-only .wide-empty");
    assert(archiveVideoBox, `${viewport.name}: Archive Video 목록을 찾지 못했습니다`);
    assertGridMatch(archivePhotoBox, archiveVideoBox, `${viewport.name}: Archive Photo/Video 목록`, ["x", "y", "width"]);

    await open(page, "/archive/links");
    const archiveTextBox = await page.locator(".archive-text-groups").boundingBox();
    assert(archiveTextBox, `${viewport.name}: Archive Text 목록을 찾지 못했습니다`);'''

          if old_archive in source:
              source = source.replace(old_archive, new_archive)
          elif new_archive not in source:
              raise SystemExit("Archive QA block not found")

          path.write_text(source)
          PY
      - name: Run browser QA
        run: node scripts/browser-qa.mjs
      - name: Commit generated files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild site from content"
          git push origin main
